apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: java-devops-lab
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/NagaAnjiDale/java-devops-lab.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true