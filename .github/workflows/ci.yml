name: Java CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: ./mvnw clean package

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/java-devops-lab:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/java-devops-lab:latest \
            .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/java-devops-lab:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/java-devops-lab:latest  
      
      - name: Update Kubernetes image tag
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: nagaanjaneuludale/java-devops-lab:.*|image: nagaanjaneuludale/java-devops-lab:${{ github.sha }}|" kubernetes/deployment.yaml

      - name: Commit Kubernetes manifest update
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/deployment.yaml
          git commit -m "Update deployment image to ${{ github.sha }} [skip ci]"
          git push    